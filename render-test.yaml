services:
  - type: web
    name: stockerau-carbon-explorer-test
    runtime: python
    plan: free
    buildCommand: bash stage5_app/render_build.sh
    startCommand: bash stage5_app/render_start.sh
    healthCheckPath: /health
    autoDeploy: false
    branch: test/stage5-recovery
    envVars:
      - key: RENDER_INCLUDE_RHINO_MODEL
        value: "1"
      - key: STOCKERAU_ALLOW_GEOMETRY_ONLY
        value: "1"
